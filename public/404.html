<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Crafting Roguelike</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var l = window.location;
      if (l.hostname.endsWith('github.io')) {
        var segments = l.pathname.split('/').filter(Boolean);
        var repo = segments.length > 0 ? segments[0] : '';
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + (repo ? '/' + repo + '/' : '/'));
      } else {
        l.replace('/');
      }
    </script>
  </head>
  <body style="background-color: #090d16; color: #f1f5f9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h1 style="color: #f59e0b; margin-bottom: 8px;">Loading Dungeon Crafting Roguelike...</h1>
      <p style="color: #94a3b8; font-size: 14px;">Redirecting to game session...</p>
    </div>
  </body>
</html>
