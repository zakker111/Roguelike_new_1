<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2" />
  
  <!-- Dungeon Gate / Diamond Accent -->
  <polygon points="32,6 56,20 56,44 32,58 8,44 8,20" fill="none" stroke="#1e293b" stroke-width="2" />
  <polygon points="32,10 52,22 52,42 32,54 12,42 12,22" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" />

  <!-- Runes / Anvil Base -->
  <path d="M22 46 L42 46 L38 51 L26 51 Z" fill="#475569" stroke="#64748b" stroke-width="1" />

  <!-- Mystic Broadsword / Blade -->
  <!-- Blade -->
  <path d="M32 12 L36 34 L32 38 L28 34 Z" fill="url(#blade)" filter="url(#glow)" />
  <line x1="32" y1="14" x2="32" y2="36" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />

  <!-- Crossguard -->
  <rect x="22" y="36" width="20" height="4" rx="1.5" fill="url(#gold)" stroke="#ca8a04" stroke-width="0.5" />
  <!-- Gem in Guard -->
  <circle cx="32" cy="38" r="1.8" fill="#38bdf8" />

  <!-- Hilt / Grip -->
  <rect x="30.5" y="40" width="3" height="6" rx="0.5" fill="#78350f" />

  <!-- Pommel -->
  <circle cx="32" cy="47.5" r="2" fill="url(#gold)" stroke="#ca8a04" stroke-width="0.5" />

  <!-- Magic Sparkles -->
  <circle cx="21" cy="22" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="43" cy="20" r="1.2" fill="#c084fc" opacity="0.8" />
  <circle cx="45" cy="32" r="1" fill="#fef08a" opacity="0.9" />
</svg>
